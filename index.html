<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FakeInfo Repository</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #151d30; border: 1px solid #22304d; border-radius: 20px; padding: 36px 28px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .app-icon { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-bottom: 16px; }
        h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; color: #fff; }
        p { color: #94a3b8; font-size: 14.5px; line-height: 1.6; margin: 0 0 24px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; background: rgba(56, 189, 248, 0.15); color: #38bdf8; font-size: 12px; font-weight: 600; margin-bottom: 16px; border: 1px solid rgba(56, 189, 248, 0.3); }
        .btn { display: block; width: 100%; padding: 14px 20px; border-radius: 12px; font-weight: 600; text-decoration: none; font-size: 15px; margin-bottom: 10px; transition: transform 0.1s ease; }
        .btn:active { transform: scale(0.98); }
        .btn-sileo { background: #2563eb; color: #ffffff; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
        .btn-sileo:hover { background: #1d4ed8; }
        .footer { margin-top: 20px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <img class="app-icon" src="assets/AppIcon.png" alt="FakeInfo Icon">
        <br>
        <span class="badge">iOS 15.0 - 16.x Rootless</span>
        <h1>FakeInfo Repo</h1>
        <p>Kho lưu trữ tweak và ứng dụng FakeInfo cho Sileo jailbreak rootless (arm64).</p>
        <a class="btn btn-sileo" href="sileo://source/">Thêm nguồn vào Sileo</a>
        <div class="footer">Package: com.custom.fakeinfo &bull; v1.0.0</div>
    </div>
</body>
</html>
